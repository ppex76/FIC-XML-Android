name: Build Invio SDI Multi Azienda Windows EXE

on:
  push:
    branches: [ "main" ]
    paths:
      - "windows/Invio_SDI_MultiAzienda_PC.py"
      - "windows/NMI_Invio_SDI_PC.py"
      - ".github/workflows/build-invio-sdi-multiazienda-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Check Python syntax
        run: python -m py_compile windows/NMI_Invio_SDI_PC.py windows/Invio_SDI_MultiAzienda_PC.py
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --paths windows --name Invio-SDI-MultiAzienda-PC windows/Invio_SDI_MultiAzienda_PC.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Invio-SDI-MultiAzienda-PC
          path: dist/Invio-SDI-MultiAzienda-PC.exe
          if-no-files-found: error
          retention-days: 30
