name: Build Studio Dinamica v8 Azienda Editabile EXE

on:
  push:
    branches: [ "main" ]
    paths:
      - "windows/Studio_Dinamica_XML_v8_Azienda_Editabile.py"
      - ".github/workflows/build-studio-v8-azienda-editabile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl
      - name: Validate source
        run: python -m py_compile windows/Studio_Dinamica_XML_v8_Azienda_Editabile.py
      - name: Build portable Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --paths windows --name Studio-Dinamica-v8-Azienda-Editabile windows/Studio_Dinamica_XML_v8_Azienda_Editabile.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Dinamica-v8-Azienda-Editabile
          path: dist/Studio-Dinamica-v8-Azienda-Editabile.exe
          if-no-files-found: error
          retention-days: 30
