name: Build Studio v8 Titolo Azienda Dinamico

on:
  push:
    branches: [ "main" ]
    paths:
      - "windows/Studio_Dinamica_XML_v8_Azienda_Editabile.py"
      - ".github/workflows/build-studio-v8-titolo-dinamico.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller openpyxl
      - run: python -m py_compile windows/Studio_Dinamica_XML_v8_Azienda_Editabile.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --paths windows --name Studio-v8-Titolo-Azienda-Editabile windows/Studio_Dinamica_XML_v8_Azienda_Editabile.py
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-v8-Titolo-Azienda-Editabile
          path: dist/Studio-v8-Titolo-Azienda-Editabile.exe
          if-no-files-found: error
          retention-days: 30
