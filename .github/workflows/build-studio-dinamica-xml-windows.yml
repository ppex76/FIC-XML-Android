name: Build Studio Dinamica XML Windows EXE

on:
  push:
    branches: [ "main" ]
    paths:
      - "windows/Studio_Dinamica_XML_NonElettroniche.py"
      - ".github/workflows/build-studio-dinamica-xml-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Studio-Dinamica-XML-NonElettroniche windows/Studio_Dinamica_XML_NonElettroniche.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Dinamica-XML-NonElettroniche
          path: dist/Studio-Dinamica-XML-NonElettroniche.exe
          if-no-files-found: error
          retention-days: 30
