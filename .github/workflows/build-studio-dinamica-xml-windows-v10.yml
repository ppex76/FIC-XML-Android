name: Build Studio Dinamica XML Windows EXE v10

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/Studio_Dinamica_XML_NonElettroniche_v10.py'
      - '.github/workflows/build-studio-dinamica-xml-windows-v10.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Studio-Dinamica-XML-NonElettroniche-v10 windows/Studio_Dinamica_XML_NonElettroniche_v10.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Dinamica-XML-NonElettroniche-v10
          path: dist/Studio-Dinamica-XML-NonElettroniche-v10.exe
          if-no-files-found: error
